services:
  - type: web
    name: controlcheck-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn controlcheck.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CONTROLCHECK_ALLOWED_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app|https://.*\\.onrender\\.com|https://.*\\.trycloudflare\\.com"
