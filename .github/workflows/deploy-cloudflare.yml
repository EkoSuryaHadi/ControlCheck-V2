name: Deploy ControlCheck API to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/cloudflare-api/package-lock.json

      - name: Install Cloudflare deployment tools
        working-directory: infra/cloudflare-api
        run: npm ci

      - name: Verify Cloudflare token
        working-directory: infra/cloudflare-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Deploy Worker and Container
        working-directory: infra/cloudflare-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
